<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Binder</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Offline first Pokémon TCG binder and deck workbench">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141720" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Binder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface2:#E9ECF2; --surface3:#DEE2EA;
  --ink:#1A1D26; --ink2:#5A6172; --ink3:#8A90A0; --line:#D9DDE6;
  --accent:#1B87B5; --accent-ink:#FFFFFF; --accent-soft:#DDF0F8;
  --yellow:#F2C94C; --ok:#2C9A5A; --warn:#D07A22; --bad:#D14646;
  --grass:#5FAE55; --fire:#E85445; --water:#3A8FDF; --lightning:#F1C232; --psychic:#A15DC0;
  --fighting:#B36A3C; --darkness:#3B4351; --metal:#8B96A6; --fairy:#E96AA5; --dragon:#C9962F; --colorless:#D8DCE3;
  --radius:14px; --radius-s:9px;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 8px 24px rgba(20,24,40,.07);
  --font-display:"Avenir Next Condensed","Avenir Next","Futura","Helvetica Neue",system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --font-mono:"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --tabbar-h:60px; --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#131620; --surface:#1B1F2B; --surface2:#242938; --surface3:#2E3446;
    --ink:#EDEFF4; --ink2:#A4AABA; --ink3:#767D90; --line:#2C3242;
    --accent:#3FA9D8; --accent-ink:#0B1A22; --accent-soft:#183542;
    --colorless:#4B5262; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
img{display:block;max-width:100%}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:12.5px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:30px;line-height:1.05}
h2{font-size:22px;line-height:1.1}
h3{font-size:16px;line-height:1.2;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-rows:auto 1fr;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:.02em}
.brand .logo{width:24px;height:32px;border-radius:4px;background:linear-gradient(160deg,var(--yellow),#E8A93A);border:2px solid #C98F1D;box-shadow:inset 0 0 0 2px #FFF3C4;position:relative}
.brand .logo::after{content:"";position:absolute;inset:6px 4px auto 4px;height:10px;border-radius:2px;background:linear-gradient(120deg,#8ED8F5,#C7A6F0,#FFB3C7)}
.topbar .spacer{flex:1}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.net i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.net.off i{background:var(--ink3);box-shadow:none}
main{padding:14px 16px calc(var(--tabbar-h) + var(--safe-b) + 18px);max-width:1180px;width:100%;margin:0 auto}
.view{display:none}.view.active{display:block}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:space-around;height:calc(var(--tabbar-h) + var(--safe-b));padding-bottom:var(--safe-b);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--ink2);font-weight:600}
.tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.active{color:var(--accent)}
@media (min-width:900px){
  .app{grid-template-columns:200px 1fr;grid-template-rows:auto 1fr}
  .topbar{grid-column:1/-1}
  .tabbar{position:sticky;top:64px;align-self:start;flex-direction:column;justify-content:flex-start;height:auto;gap:4px;padding:16px 10px;background:none;border:0;backdrop-filter:none}
  .tabbar button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-radius:10px;font-size:14px}
  .tabbar button.active{background:var(--surface);box-shadow:var(--shadow)}
  main{padding:20px 28px 40px}
}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 15px;border-radius:11px;background:var(--surface2);color:var(--ink);font-weight:600;font-size:14px;border:1px solid transparent;transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.icon{width:40px;padding:0}
.btn.icon.sm{width:32px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.wide{width:100%}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.input,select.input,textarea.input{width:100%;min-height:42px;padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px}
textarea.input{min-height:120px;resize:vertical;font-family:var(--font-mono);font-size:13px;line-height:1.4}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.seg{display:inline-flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.stepper button{width:38px;height:38px;font-size:20px;color:var(--accent);font-weight:700}
.stepper span{min-width:34px;text-align:center;font-family:var(--font-mono);font-weight:700}
.stepper.sm button{width:30px;height:30px;font-size:17px}
.stepper.sm span{min-width:26px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:var(--surface2);font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.mark{font-family:var(--font-mono);background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:0 6px}
.card-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.stat-strip{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 14px}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font-family:var(--font-display);font-size:26px;line-height:1;font-weight:700}
.stat span{font-size:11.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.empty{padding:36px 20px;text-align:center;color:var(--ink2);border:1.5px dashed var(--line);border-radius:var(--radius)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:20px;margin-bottom:6px}
.msg{padding:10px 12px;border-radius:10px;font-size:13.5px;background:var(--surface2)}
.msg.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:color-mix(in srgb,var(--warn) 80%,var(--ink))}
.msg.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:color-mix(in srgb,var(--bad) 85%,var(--ink))}
.msg.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:color-mix(in srgb,var(--ok) 80%,var(--ink))}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink2)}.kv dd{margin:0}
.divider{height:1px;background:var(--line);margin:14px 0}
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .thumb{width:44px;height:61px;border-radius:5px;object-fit:cover;background:var(--surface2);flex:none}
.list-item .name{font-weight:600}
.list-item .sub{font-size:12px;color:var(--ink2)}
.link{background:none;color:var(--accent);font-weight:600;padding:0}
.rc-warn{font-size:12.5px;color:var(--ink2);margin-top:6px}

/* ---------- binder grid ---------- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .input{min-height:38px;font-size:15px}
.toolbar select.input{min-width:150px;width:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:760px){.grid{grid-template-columns:repeat(5,1fr);gap:12px}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(7,1fr)}}
.tile{position:relative;border-radius:10px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;transition:transform .12s ease}
.tile:hover{transform:translateY(-2px)}
.tile .art{position:relative;aspect-ratio:63/88;background:var(--surface2);overflow:hidden}
.tile .art img{width:100%;height:100%;object-fit:cover}
.tile .art .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;font-family:var(--font-display);font-size:13px;color:var(--ink3);line-height:1.15}
.tile .qty{position:absolute;top:6px;right:6px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:rgba(20,22,30,.78);color:#fff;font:700 12px/22px var(--font-mono);text-align:center;backdrop-filter:blur(4px)}
.tile .var{position:absolute;left:6px;bottom:6px;padding:1px 6px;border-radius:6px;font:700 10px/16px var(--font-body);letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.88);color:#1A1D26}
.tile .var.reverse{background:linear-gradient(90deg,#BFEAF9,#E9C8FF,#FFD1E1);color:#26243B}
.tile .var.holo{background:linear-gradient(90deg,#FFE7A0,#FFC3C3,#C7E0FF);color:#3A2E12}
.tile .var.firstEdition{background:#222;color:#fff}
.tile .meta{padding:6px 8px 7px}
.tile .meta .n{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .meta .s{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--ink2);font-family:var(--font-mono);white-space:nowrap}
.tile .meta .s>span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile .meta .s .price{color:var(--ink);flex:none}
.tile.foil .art::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.28) 42%,rgba(150,225,255,.32) 48%,rgba(255,150,225,.28) 54%,transparent 68%);background-size:220% 220%;background-position:100% 0;mix-blend-mode:screen;transition:background-position .9s ease}
.tile.foil:hover .art::after{background-position:0 100%}
@media (prefers-reduced-motion:reduce){.tile,.tile.foil .art::after,.btn{transition:none}}
.tile.missing{opacity:.62}
.tile.missing .art::before{content:"missing";position:absolute;z-index:1;top:6px;left:6px;padding:1px 6px;border-radius:6px;background:var(--bad);color:#fff;font:700 10px/16px var(--font-body);text-transform:uppercase}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,12,20,.42);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fade .15s ease}
.sheet-panel{width:100%;max-height:92dvh;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:rise .2s ease;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.sheet-head h2{flex:1;font-size:20px}
.sheet-body{overflow:auto;padding:4px 16px calc(20px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheet-close{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink2)}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:700px){.sheet{align-items:center;padding:24px}.sheet-panel{max-width:640px;max-height:88dvh;border-radius:18px}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-panel{animation:none}}

/* ---------- card detail ---------- */
.detail{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:600px){.detail{grid-template-columns:230px 1fr}}
@media (max-width:599px){.detail .art{max-width:min(230px,58vw);margin:0 auto;width:100%}}
.detail .art{border-radius:12px;overflow:hidden;background:var(--surface2);aspect-ratio:63/88;box-shadow:var(--shadow)}
.detail .art img{width:100%;height:100%;object-fit:cover}
.detail .title{font-family:var(--font-display);font-size:26px;line-height:1.05;font-weight:700}
.detail .subtitle{color:var(--ink2);font-size:13.5px;margin-top:2px}
.pip{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font:700 10px/1 var(--font-body);color:#fff;border:1px solid rgba(0,0,0,.15);vertical-align:middle;margin-right:2px}
.pip.Colorless{color:#333}
.pip.Lightning{color:#4a3a00}
.attack{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.attack .cost{flex:none;min-width:40px;display:flex;flex-wrap:wrap;gap:1px;padding-top:2px}
.attack .body{flex:1}
.attack .body b{font-weight:700}
.attack .dmg{font-family:var(--font-display);font-size:20px;font-weight:700;flex:none;min-width:34px;text-align:right}
.ability .tag{font-size:11px;font-weight:700;color:var(--fire);text-transform:uppercase;letter-spacing:.06em}
.prices{width:100%;border-collapse:collapse;font-size:13.5px}
.prices th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600;padding:4px 0}
.prices td{padding:6px 0;border-top:1px solid var(--line);font-family:var(--font-mono)}
.prices td:first-child{font-family:var(--font-body);font-weight:600}
.prices tr.owned td:first-child::after{content:"owned";margin-left:6px;font-size:10px;font-weight:700;color:var(--ok);text-transform:uppercase}
.own-rows .own-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.own-row .vn{flex:1;font-weight:600}
.own-row select{min-height:34px;padding:4px 28px 4px 8px;font-size:13px;border-radius:8px}

/* ---------- add view ---------- */
.set-picker{position:relative}
.set-list{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);max-height:280px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.set-list button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 12px;text-align:left;border-bottom:1px solid var(--line)}
.set-list button:last-child{border-bottom:0}
.set-list button:hover,.set-list button.hl{background:var(--surface2)}
.set-list img{width:26px;height:26px;object-fit:contain}
.set-list .sn{font-weight:600;flex:1;font-size:14px}
.set-list .sc{font-family:var(--font-mono);font-size:11.5px;color:var(--ink2)}
.commit-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:12px}
.commit-row .btn{flex:1 1 210px;min-height:44px}
.preview{display:flex;gap:14px;align-items:flex-start}
.preview .art{width:110px;flex:none;aspect-ratio:63/88;border-radius:8px;overflow:hidden;background:var(--surface2)}
.preview .art img{width:100%;height:100%;object-fit:cover}
.preview .t{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.05}
.recent .list-item{padding:8px 0}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:600px){.results{grid-template-columns:repeat(5,1fr)}}
@media (min-width:1000px){.results{grid-template-columns:repeat(8,1fr)}}

/* ---------- scanner ---------- */
.scan-wrap{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:70dvh}
.scan-wrap video,.scan-wrap canvas{width:100%;height:100%;object-fit:cover}
.scan-guide{position:absolute;inset:0;pointer-events:none}
.scan-guide .frame{position:absolute;left:12%;right:12%;top:8%;aspect-ratio:63/88;border:2px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.42)}
.scan-guide .band{position:absolute;left:0;right:0;bottom:2%;height:11%;border:2px dashed var(--yellow);border-radius:6px}
.scan-guide .band.top{bottom:auto;top:2%;height:9%}
.scan-guide .hint{position:absolute;left:0;right:0;bottom:6%;text-align:center;color:#fff;font-size:12.5px;text-shadow:0 1px 3px #000}
.cands{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.cands .list-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}

/* ---------- decks ---------- */
.deck-card{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);text-align:left;width:100%}
.deck-card .dn{font-family:var(--font-display);font-size:19px;font-weight:700}
.deck-card .ds{font-size:12.5px;color:var(--ink2);margin-top:2px}
.deck-card .thumbs{display:flex;flex:none}
.deck-card .thumbs img{width:34px;height:47px;border-radius:4px;object-fit:cover;margin-left:-14px;box-shadow:0 1px 3px rgba(0,0,0,.3);background:var(--surface2)}
.deck-card .thumbs img:first-child{margin-left:0}
.strip{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin:10px 0 6px}
.strip i{display:block;aspect-ratio:1;border-radius:2px;background:var(--surface3)}
.strip i.Pokemon{background:var(--fire)}
.strip i.Trainer{background:var(--accent)}
.strip i.Energy{background:var(--yellow)}
.strip i.over{background:var(--bad)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
.deck-layout{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.deck-layout{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.deck-group h3{margin:14px 0 4px}
.dl-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.dl-row:last-child{border-bottom:0}
.dl-row .thumb{width:32px;height:44px;border-radius:4px;object-fit:cover;background:var(--surface2);flex:none}
.dl-row .nm{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.dl-row .nm .link{display:block;max-width:100%;text-align:left}
.dl-row .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-row .nm span{font-size:11.5px;color:var(--ink2);font-family:var(--font-mono)}
.dl-row .own{font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:6px}
.dl-row .own.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.dl-row .own.short{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.dl-row .flag{font-size:11px;font-weight:700;color:var(--warn)}
.pool-tabs{margin-bottom:8px}
.pool .grid{grid-template-columns:repeat(4,1fr)}
@media (min-width:520px){.pool .grid{grid-template-columns:repeat(5,1fr)}}
@media (min-width:1100px){.pool .grid{grid-template-columns:repeat(5,1fr)}}
.pool .tile .meta{padding:4px 6px 5px}
.pool .tile .meta .s{flex-wrap:wrap;white-space:normal;gap:2px 6px}
.pool .tile .meta .s>span:first-child{white-space:nowrap}
.pool .tile .meta .n{font-size:11.5px}
.deck-title{width:100%;font-family:var(--font-display);font-size:26px;font-weight:700;border:0;background:transparent;padding:4px 0;border-bottom:1.5px dashed var(--line);border-radius:0}
.deck-title:focus{border-bottom-color:var(--accent);outline:none;box-shadow:none}
.problems{display:flex;flex-direction:column;gap:6px;margin-top:8px}

/* ---------- settings ---------- */
.setting{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.setting .txt{flex:1 1 210px;min-width:0}
.setting>:not(.txt){margin-left:auto}
.setting .txt b{display:block;font-weight:600}
.setting .txt span{font-size:12.5px;color:var(--ink2)}
.switch{position:relative;width:46px;height:28px;border-radius:999px;background:var(--surface3);transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(18px)}
.about p{font-size:13.5px;color:var(--ink2);margin:6px 0}
.about code{font-family:var(--font-mono);font-size:12px;background:var(--surface2);padding:1px 5px;border-radius:5px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + var(--safe-b) + 14px);transform:translateX(-50%) translateY(20px);z-index:60;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){#toast{bottom:28px}}
.progress{height:6px;border-radius:999px;background:var(--surface3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span>Binder</span></div>
    <div class="spacer"></div>
    <div class="net" id="net" title="Connection"><i></i><span>Online</span></div>
  </header>
  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button data-act="nav" data-view="collection" class="active" aria-label="Binder">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18M4 8h4M4 12h4M4 16h4"/></svg><span>Binder</span></button>
    <button data-act="nav" data-view="add" aria-label="Add cards">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Add</span></button>
    <button data-act="nav" data-view="decks" aria-label="Decks">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="16" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v14"/><path d="M6.5 11h6M6.5 15h6"/></svg><span>Decks</span></button>
    <button data-act="nav" data-view="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
  </nav>
  <main>
    <section class="view active" id="view-collection" aria-label="Binder"></section>
    <section class="view" id="view-add" aria-label="Add cards"></section>
    <section class="view" id="view-decks" aria-label="Decks"></section>
    <section class="view" id="view-settings" aria-label="Settings"></section>
  </main>
</div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   Binder: offline first Pokémon TCG collection + deck workbench
   Data: TCGdex (https://tcgdex.dev), prices via TCGdex (TCGplayer / Cardmarket)
   Storage: IndexedDB in this browser. Nothing leaves the device except API lookups.
   ===================================================================== */
const API_BASE = 'https://api.tcgdex.net/v2/en';
const ASSET_QUALITY = { low: '/low.webp', high: '/high.webp' };
const DB_NAME = 'binder-db';
const DB_VER = 1;
const SETS_MAX_AGE = 24 * 3600 * 1000;      // refresh the set list once a day
const PRICE_MAX_AGE = 6 * 3600 * 1000;      // "refresh all" skips prices newer than this
const VARIANTS = [
  { key: 'normal',       label: 'Normal',       short: 'Normal' },
  { key: 'holo',         label: 'Holo',         short: 'Holo' },
  { key: 'reverse',      label: 'Reverse holo', short: 'Reverse' },
  { key: 'firstEdition', label: '1st edition',  short: '1st ed' },
  { key: 'other',        label: 'Other finish', short: 'Other' },
];
const VARIANT_BY_KEY = Object.fromEntries(VARIANTS.map(v => [v.key, v]));
const CONDITIONS = ['', 'NM', 'LP', 'MP', 'HP', 'DMG'];
const TYPE_LETTER = { Grass: 'G', Fire: 'R', Water: 'W', Lightning: 'L', Psychic: 'P', Fighting: 'F', Darkness: 'D', Metal: 'M', Fairy: 'Y', Dragon: 'N', Colorless: 'C' };
const FORMATS = { standard: 'Standard', expanded: 'Expanded', unlimited: 'Unlimited' };
const BW_RELEASE = '2011-04-25'; // Expanded starts at Black & White
const DEFAULT_SETTINGS = {
  priceSource: 'tcgplayer',   // 'tcgplayer' (USD) or 'cardmarket' (EUR)
  minMark: 'H',               // lowest regulation mark that is Standard legal
  showPrices: true,
  cacheImages: true,
  deckMatch: 'name',          // 'name': same name from any set counts as owned, 'exact': exact card only
};

/* ---------- tiny utils ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const now = () => Date.now();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const cmpNum = (a, b) => {
  // localId sort: numbers first by value, then alphanumerics (TG05, SV049, GG12)
  const na = /^\d+$/.test(a), nb = /^\d+$/.test(b);
  if (na && nb) return Number(a) - Number(b);
  if (na) return -1; if (nb) return 1;
  return String(a).localeCompare(String(b), undefined, { numeric: true });
};
function fmtMoney(v, unit) {
  if (v == null || isNaN(v)) return '';
  const cur = /^[A-Z]{3}$/.test(String(unit)) ? String(unit) : (unit === 'EUR' ? 'EUR' : 'USD');
  try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur, minimumFractionDigits: 2 }).format(v); }
  catch { return (cur === 'EUR' ? '€' : '$') + Number(v).toFixed(2); }
}
function fmtAge(ts) {
  if (!ts) return 'never';
  const t = typeof ts === 'number' ? ts : Date.parse(ts);
  if (!t) return 'unknown';
  const d = now() - t;
  if (d < 60e3) return 'just now';
  if (d < 3600e3) return Math.round(d / 60e3) + ' min ago';
  if (d < 86400e3) return Math.round(d / 3600e3) + ' h ago';
  return Math.round(d / 86400e3) + ' d ago';
}
function pip(type) {
  const t = String(type || 'Colorless');
  return `<i class="pip ${esc(t)}" style="background:var(--${esc(t.toLowerCase())},var(--colorless))" title="${esc(t)}">${TYPE_LETTER[t] || t[0]}</i>`;
}
function toast(msg, ms = 2200) {
  const el = $('#toast'); if (!el) return;
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), ms);
}

/* ---------- IndexedDB ---------- */
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      const mk = (name, opts, idx) => { if (!db.objectStoreNames.contains(name)) { const st = db.createObjectStore(name, opts); (idx || []).forEach(([n, k]) => st.createIndex(n, k)); } };
      mk('cards', { keyPath: 'id' });
      mk('owned', { keyPath: 'key' }, [['cardId', 'cardId']]);
      mk('decks', { keyPath: 'id' });
      mk('sets', { keyPath: 'id' });
      mk('images', { keyPath: 'cardId' });
      mk('meta', { keyPath: 'k' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Database blocked by another tab'));
  });
}
let dbPromise = null;
const getDB = () => (dbPromise ||= openDB());
function tx(store, mode, fn) {
  return getDB().then(db => new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    let out;
    try { out = fn(t.objectStore(store)); } catch (e) { rej(e); return; }
    t.oncomplete = () => res(out && typeof out === 'object' && 'result' in out ? out.result : out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('Transaction aborted'));
  }));
}
const dbGet = (s, k) => tx(s, 'readonly', st => st.get(k));
const dbAll = s => tx(s, 'readonly', st => st.getAll());
const dbPut = (s, v) => tx(s, 'readwrite', st => st.put(v));
const dbPutMany = (s, vals) => tx(s, 'readwrite', st => { vals.forEach(v => st.put(v)); return null; });
const dbDel = (s, k) => tx(s, 'readwrite', st => st.delete(k));
const dbClear = s => tx(s, 'readwrite', st => st.clear());
const metaGet = async k => (await dbGet('meta', k))?.v;
const metaSet = (k, v) => dbPut('meta', { k, v });

/* ---------- state ---------- */
const S = {
  sets: [],                 // SetBrief[] in release order (oldest first), each may carry .detail
  setsById: new Map(),
  cards: new Map(),         // cardId -> normalized card (with pricing)
  owned: new Map(),         // key -> {key, cardId, variant, qty, condition, note, addedAt, updatedAt}
  decks: new Map(),         // id -> deck
  images: new Map(),        // cardId -> object URL for cached low res image
  settings: { ...DEFAULT_SETTINGS },
  online: typeof navigator !== 'undefined' ? navigator.onLine !== false : true,
  view: 'collection',
  ui: {
    collection: { q: '', set: '', variant: '', cat: '', sort: 'recent' },
    add: { mode: 'set', setId: '', number: '', card: null, variant: 'normal', qty: 1, cond: '', note: '', busy: false, error: '', results: [], q: '' },
    deck: { id: null, pool: 'binder', q: '', results: [], busy: false, filterLegal: true },
    setsListOpen: false,
  },
};

/* ---------- API ---------- */
async function apiGet(path, { timeout = 15000 } = {}) {
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const t = ctrl && setTimeout(() => ctrl.abort(), timeout);
  try {
    const r = await fetch(API_BASE + path, { signal: ctrl?.signal, headers: { Accept: 'application/json' } });
    if (r.status === 404) { const e = new Error('Not found'); e.code = 404; throw e; }
    if (!r.ok) throw new Error(`TCGdex returned ${r.status}`);
    return await r.json();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('The card database took too long to answer');
    if (e.code === 404) throw e;
    if (!S.online) throw new Error('You are offline. Cached cards still work; new lookups need a connection.');
    throw new Error(e.message || 'Could not reach the card database');
  } finally { if (t) clearTimeout(t); }
}

/* ---------- sets ---------- */
function setOrderIndex(setId) { const s = S.setsById.get(setId); return s ? s.order : -1; }
async function loadSetsFromApi() {
  const list = await apiGet('/sets');
  if (!Array.isArray(list) || !list.length) throw new Error('Set list came back empty');
  const merged = list.map((b, i) => {
    const prev = S.setsById.get(b.id) || {};
    return { ...prev, id: b.id, name: b.name, logo: b.logo || prev.logo, symbol: b.symbol || prev.symbol, cardCount: b.cardCount || prev.cardCount || {}, order: i };
  });
  S.sets = merged; S.setsById = new Map(merged.map(s => [s.id, s]));
  await dbPutMany('sets', merged);
  await metaSet('setsFetchedAt', now());
  return merged;
}
async function ensureSets({ force = false } = {}) {
  if (S.sets.length && !force) return S.sets;
  if (!S.online) throw new Error('The set list is not cached yet. Connect once so it can be downloaded.');
  return loadSetsFromApi();
}
async function refreshSetsIfStale() {
  try {
    const at = await metaGet('setsFetchedAt');
    if (!S.sets.length || !at || now() - at > SETS_MAX_AGE) await loadSetsFromApi();
  } catch (e) { console.warn('Set refresh skipped:', e.message); }
}
async function getSetDetail(setId, { force = false } = {}) {
  let s = S.setsById.get(setId);
  if (s?.detail && !force) return s;
  const d = await apiGet('/sets/' + encodeURIComponent(setId));
  if (!s) { s = { id: d.id, name: d.name, logo: d.logo, symbol: d.symbol, cardCount: d.cardCount || {}, order: S.sets.length }; S.sets.push(s); S.setsById.set(s.id, s); }
  s.name = d.name || s.name; s.logo = d.logo || s.logo; s.symbol = d.symbol || s.symbol; s.cardCount = d.cardCount || s.cardCount;
  s.detail = {
    tcgOnline: d.tcgOnline || null, releaseDate: d.releaseDate || null, serie: d.serie || null, legal: d.legal || null,
    cards: (d.cards || []).map(c => ({ id: c.id, localId: String(c.localId), name: c.name, image: c.image || null })),
    fetchedAt: now(),
  };
  await dbPut('sets', s);
  return s;
}
function setCode(setId) {
  const s = S.setsById.get(setId);
  return s?.detail?.tcgOnline || (setId || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}
function findSetByCode(code) {
  const c = String(code || '').toUpperCase();
  return S.sets.find(s => (s.detail?.tcgOnline || '').toUpperCase() === c) || null;
}
/* Resolve a PTCGL / PTCGO set code (SVI, MEW, PAR...) by walking newest sets first and caching their details. */
async function resolveSetCode(code, { limit = 60 } = {}) {
  const hit = findSetByCode(code); if (hit) return hit;
  if (!S.online) return null;
  const candidates = [...S.sets].reverse().filter(s => !s.detail).slice(0, limit);
  for (const s of candidates) {
    try { await getSetDetail(s.id); } catch (e) { continue; }
    if ((s.detail?.tcgOnline || '').toUpperCase() === String(code).toUpperCase()) return s;
  }
  return null;
}

/* ---------- cards ---------- */
function normalizeCard(raw) {
  const set = raw.set || {};
  const c = {
    id: raw.id,
    localId: String(raw.localId ?? ''),
    name: raw.name || '',
    category: raw.category || 'Pokemon',
    image: raw.image || null,
    setId: set.id || String(raw.id || '').split('-')[0],
    setName: set.name || '',
    setOfficial: set.cardCount?.official ?? null,
    setTotal: set.cardCount?.total ?? null,
    rarity: raw.rarity || null,
    illustrator: raw.illustrator || null,
    variants: raw.variants || null,
    hp: raw.hp ?? null,
    types: raw.types || [],
    evolveFrom: raw.evolveFrom || null,
    stage: raw.stage || null,
    suffix: raw.suffix || null,
    dexId: raw.dexId || null,
    description: raw.description || null,
    abilities: raw.abilities || [],
    attacks: raw.attacks || [],
    weaknesses: raw.weaknesses || [],
    resistances: raw.resistances || [],
    retreat: raw.retreat ?? null,
    regulationMark: raw.regulationMark || null,
    legal: raw.legal || null,
    trainerType: raw.trainerType || null,
    energyType: raw.energyType || null,
    effect: raw.effect || null,
    updated: raw.updated || null,
    pricing: raw.pricing || null,
    pricingAt: raw.pricing ? now() : null,
    fetchedAt: now(),
  };
  if (!c.setName) { const s = S.setsById.get(c.setId); if (s) { c.setName = s.name; c.setOfficial = s.cardCount?.official ?? null; } }
  return c;
}
async function saveCard(card) { S.cards.set(card.id, card); await dbPut('cards', card); ensureSetCodeBg(card.setId); return card; }
const setDetailQueue = new Set();
function ensureSetCodeBg(setId) {
  const s = S.setsById.get(setId);
  if (!setId || !s || s.detail || setDetailQueue.has(setId) || !S.online) return;
  setDetailQueue.add(setId);
  getSetDetail(setId).then(() => {
    // codes just became known: refresh whatever grid is showing, without touching inputs
    if (S.view === 'collection') renderBinderGrid?.();
    if (S.view === 'add') renderRecent?.();
    if (S.view === 'decks' && S.ui.deck.id && $('#deck-main')) { const d = S.decks.get(S.ui.deck.id); if (d) { renderDeckMain(d); renderPool(d); } }
  }).catch(() => { }).finally(() => setDetailQueue.delete(setId));
}
async function fetchCardRaw(setId, localId) { return apiGet(`/sets/${encodeURIComponent(setId)}/${encodeURIComponent(localId)}`); }
async function getCard(setId, localId, { force = false } = {}) {
  const guess = `${setId}-${localId}`;
  if (!force && S.cards.has(guess)) return S.cards.get(guess);
  const raw = await fetchCardRaw(setId, localId);
  const card = normalizeCard(raw);
  await saveCard(card);
  cacheImage(card);
  return card;
}
async function getCardById(id, { force = false } = {}) {
  if (!force && S.cards.has(id)) return S.cards.get(id);
  const raw = await apiGet('/cards/' + encodeURIComponent(id));
  const card = normalizeCard(raw);
  await saveCard(card);
  cacheImage(card);
  return card;
}
async function refreshCard(id) {
  const old = S.cards.get(id);
  try {
    const raw = await apiGet('/cards/' + encodeURIComponent(id));
    const fresh = normalizeCard(raw);
    if (!fresh.pricing && old?.pricing) { fresh.pricing = old.pricing; fresh.pricingAt = old.pricingAt; }
    await saveCard(fresh);
    return fresh;
  } catch (e) { throw e; }
}
async function searchCardsByName(q) {
  const list = await apiGet(`/cards?name=${encodeURIComponent(q)}&pagination:page=1&pagination:itemsPerPage=250`);
  const arr = Array.isArray(list) ? list : [];
  // newest sets first
  return arr.map(b => ({ id: b.id, localId: String(b.localId), name: b.name, image: b.image || null, setId: String(b.id).split('-')[0] }))
    .sort((a, b) => setOrderIndex(b.setId) - setOrderIndex(a.setId) || cmpNum(a.localId, b.localId));
}
function localSearch(q) {
  const n = norm(q); if (!n) return [];
  return [...S.cards.values()].filter(c => norm(c.name).includes(n)).sort((a, b) => setOrderIndex(b.setId) - setOrderIndex(a.setId) || cmpNum(a.localId, b.localId));
}

/* ---------- images ---------- */
function imgUrl(card, quality = 'low') { return card?.image ? card.image + ASSET_QUALITY[quality] : null; }
function imgSrc(card) {
  if (!card) return null;
  if (S.images.has(card.id)) return S.images.get(card.id);
  return S.online ? imgUrl(card, 'low') : null;
}
const imageQueue = new Set();
async function cacheImage(card) {
  if (!card?.image || !S.settings.cacheImages || S.images.has(card.id) || imageQueue.has(card.id) || !S.online) return;
  imageQueue.add(card.id);
  try {
    const r = await fetch(imgUrl(card, 'low'));
    if (!r.ok) throw new Error('image ' + r.status);
    const blob = await r.blob();

/* ---------- pricing ---------- */
const TCG_KEYS = {
  normal: ['normal', 'unlimited'],
  holo: ['holofoil', 'unlimited-holofoil', 'holo'],
  reverse: ['reverse-holofoil', 'reverse', 'reverse-holo'],
  firstEdition: ['1st-edition-holofoil', '1st-edition', '1st-edition-normal'],
  other: ['normal', 'holofoil', 'reverse-holofoil'],
};
function tcgVariantKeys(tp) { return Object.keys(tp || {}).filter(k => k !== 'updated' && k !== 'unit' && tp[k] && typeof tp[k] === 'object'); }
function tcgKeyFor(variant, tp) {
  if (!tp) return null;
  for (const k of (TCG_KEYS[variant] || TCG_KEYS.normal)) if (tp[k]) return k;
  const keys = tcgVariantKeys(tp); return keys[0] || null;
}
function tcgPrice(tp, variant) {
  const k = tcgKeyFor(variant, tp); if (!k) return null;
  const v = tp[k]; const val = v.marketPrice ?? v.midPrice ?? v.lowPrice ?? v.directLowPrice;
  if (val == null) return null;
  return { value: Number(val), unit: /^[A-Z]{3}$/.test(String(tp.unit)) ? tp.unit : 'USD', source: 'TCGplayer', kind: k, updated: tp.updated };
}
function cmPrice(cm, variant) {
  if (!cm) return null;
  const foil = variant !== 'normal';
  const val = foil ? (cm['trend-holo'] ?? cm['avg-holo'] ?? cm['avg7-holo'] ?? cm['avg30-holo'] ?? cm.trend ?? cm.avg) : (cm.trend ?? cm.avg ?? cm.avg7 ?? cm.avg30 ?? cm.low);
  if (val == null) return null;
  return { value: Number(val), unit: /^[A-Z]{3}$/.test(String(cm.unit)) ? cm.unit : 'EUR', source: 'Cardmarket', kind: foil ? 'holo' : 'normal', updated: cm.updated };
}
function priceFor(card, variant = 'normal') {
  const p = card?.pricing; if (!p) return null;
  const order = S.settings.priceSource === 'cardmarket' ? [cmPrice.bind(null, p.cardmarket), tcgPrice.bind(null, p.tcgplayer)] : [tcgPrice.bind(null, p.tcgplayer), cmPrice.bind(null, p.cardmarket)];
  for (const f of order) { const r = f(variant); if (r) return r; }
  return null;
}
function priceLabel(card, variant) { const p = priceFor(card, variant); return p ? fmtMoney(p.value, p.unit) : ''; }
function variantLabel(v) { return VARIANT_BY_KEY[v]?.label || v; }
function tcgKindLabel(k) {
  return ({ normal: 'Normal', holofoil: 'Holo', 'reverse-holofoil': 'Reverse holo', reverse: 'Reverse holo', 'reverse-holo': 'Reverse holo', '1st-edition-holofoil': '1st ed. holo', '1st-edition': '1st edition', '1st-edition-normal': '1st edition', unlimited: 'Unlimited', 'unlimited-holofoil': 'Unlimited holo', holo: 'Holo' })[k] || k;
}

const ownedKey = (cardId, variant) => `${cardId}|${variant}`;
function ownedEntries(cardId) { return VARIANTS.map(v => S.owned.get(ownedKey(cardId, v.key))).filter(Boolean); }
function ownedQty(cardId) { return ownedEntries(cardId).reduce((n, o) => n + (o.qty || 0), 0); }
function ownedByName() {

async function setOwned(cardId, variant, qty, extra = {}) {
  const key = ownedKey(cardId, variant);
  const prev = S.owned.get(key);
  if (qty <= 0) { if (prev) { S.owned.delete(key); await dbDel('owned', key); } return null; }
  const rec = { key, cardId, variant, qty, condition: extra.condition ?? prev?.condition ?? '', note: extra.note ?? prev?.note ?? '', addedAt: prev?.addedAt || now(), updatedAt: now() };
  S.owned.set(key, rec); await dbPut('owned', rec);

}

}
function collectionValue() {
  let total = 0, unit = null;
  for (const o of S.owned.values()) { const c = S.cards.get(o.cardId); const p = priceFor(c, o.variant); if (p) { total += p.value * o.qty; unit ||= p.unit; } }

}

   Legality

function standardLegality(card) {
  const min = (S.settings.minMark || 'H').toUpperCase();
  const m = (card.regulationMark || '').toUpperCase();
  if (isBasicEnergy(card)) return { state: 'legal' };            // basic Energy from any set is always legal
  if (m && m >= min) return { state: 'legal' };
  const rc = reprintVerdict(card);
  if (rc?.legal) return { state: 'legal', via: rc.viaId, reason: `Older print. Legal because ${rc.viaCode || 'a current print'} carries regulation mark ${rc.viaMark}.` };
  if (m) {
    if (rc && rc.legal === false) return { state: 'illegal', reason: `Rotated out (mark ${m}). No current print with the same text was found.` };
    return { state: 'unknown', reason: `Rotated print (mark ${m}). It stays legal only if the same card exists with mark ${min} or later; checked automatically when online.` };
  }
  if (card.legal?.standard === true) return { state: 'legal' };
  if (rc && rc.legal === false) return { state: 'illegal', reason: 'No regulation mark and no current print with the same text was found.' };
  return { state: 'unknown', reason: 'No regulation mark. Legal only if the same card was reprinted with a current mark; checked automatically when online.' };
}
function setReleaseDate(setId) { return S.setsById.get(setId)?.detail?.releaseDate || null; }
function expandedLegal(card) {
  if (card.legal?.expanded === true) return true;
  if (card.legal?.expanded === false) return false;
  const rd = setReleaseDate(card.setId);
  if (rd) return rd >= BW_RELEASE;
  const m = (card.regulationMark || '').toUpperCase();
  return !!m; // marks only exist from 2020 onward, all Expanded legal
}

function isAceSpec(card) { return /ace spec/i.test(card.rarity || '') || /ACE SPEC/.test(card.effect || '') || /ACE SPEC/.test(card.name || ''); }

/* ---------- reprints ----------
   An older print stays Standard legal when a card with the same name and identical text
   carries a current regulation mark (Rare Candy, Professor's Research, Switch...). The
   check needs the network once per card name; the verdict is stored on the card record. */
const REPRINT_MAX_AGE = 30 * 24 * 3600 * 1000;   // re-check "no reprint" verdicts monthly
function textKey(card) {
  const n = s => norm(s).replace(/ /g, '');
  if (card.category === 'Pokemon') return ['p', n(card.name), card.hp || '', (card.abilities || []).map(a => n(a.name) + n(a.effect)).join(';'), (card.attacks || []).map(a => (a.cost || []).join('') + n(a.name) + n(a.damage) + n(a.effect)).join(';')].join('|');

async function checkReprint(card) {
  if (!S.online || !needsReprintCheck(card)) return reprintVerdict(card);
  const min = (S.settings.minMark || 'H').toUpperCase();
  const key = norm(card.name) + '|' + textKey(card);
  if (reprintInflight.has(key)) return reprintInflight.get(key);
  const job = (async () => {
    await reprintSlot();
    try {
      const list = await apiGet(`/cards?name=${encodeURIComponent(card.name)}&pagination:page=1&pagination:itemsPerPage=250`);
      const same = (Array.isArray(list) ? list : []).filter(b => norm(b.name) === norm(card.name) && b.id !== card.id)
        .map(b => ({ ...b, setId: String(b.id).split('-')[0] }))
        .sort((a, b) => setOrderIndex(b.setId) - setOrderIndex(a.setId));   // newest print first

  if (!todo.length) return;
  Promise.allSettled(todo.map(c => checkReprint(c))).then(() => onDone && onDone());

function analyzeDeck(deck) {
  const rows = deck.cards.map(({ cardId, qty }) => ({ cardId, qty, card: S.cards.get(cardId) || null })).filter(r => r.card);
  const missingData = deck.cards.length - rows.length;
  const total = deck.cards.reduce((n, c) => n + c.qty, 0);
  const byCat = { Pokemon: 0, Trainer: 0, Energy: 0 };
  rows.forEach(r => { byCat[r.card.category] = (byCat[r.card.category] || 0) + r.qty; });
  const problems = [];
  if (total !== 60) problems.push({ level: 'bad', text: total < 60 ? `${total} of 60 cards. ${60 - total} more to go.` : `${total} cards, ${total - 60} over the limit of 60.` });
  // copies per name (basic energy exempt)
  const byName = new Map();
  rows.forEach(r => { if (isBasicEnergy(r.card)) return; const k = norm(r.card.name); byName.set(k, (byName.get(k) || 0) + r.qty); });
  for (const [k, n] of byName) if (n > 4) problems.push({ level: 'bad', text: `${n} copies of ${rows.find(r => norm(r.card.name) === k).card.name}. Max is 4 with the same name.` });
  const ace = rows.filter(r => isAceSpec(r.card)).reduce((n, r) => n + r.qty, 0);

  const prism = new Map(); rows.forEach(r => { if (isPrismStar(r.card)) prism.set(norm(r.card.name), (prism.get(norm(r.card.name)) || 0) + r.qty); });
  for (const [k, n] of prism) if (n > 1) problems.push({ level: 'bad', text: `Two or more Prism Star ${k}. Only one of each Prism Star.` });
  if (rows.length && !rows.some(r => r.card.category === 'Pokemon' && (r.card.stage || 'Basic') === 'Basic')) problems.push({ level: 'warn', text: 'No Basic Pokémon. You need at least one to start a game.' });
  // legality
  rows.forEach(r => {
    r.legal = { state: 'legal' };
    if (deck.format === 'standard') r.legal = standardLegality(r.card);
    else if (deck.format === 'expanded') r.legal = expandedLegal(r.card) ? { state: 'legal' } : { state: 'illegal', reason: 'Not Expanded legal (pre Black & White)' };
  });
  const illegal = rows.filter(r => r.legal.state === 'illegal');
  if (illegal.length) problems.push({ level: 'bad', text: `${illegal.length} card${illegal.length > 1 ? 's' : ''} not legal in ${FORMATS[deck.format]}: ${illegal.slice(0, 4).map(r => r.card.name).join(', ')}${illegal.length > 4 ? '…' : ''}.` });
  const unknown = rows.filter(r => r.legal.state === 'unknown');
  if (unknown.length && deck.format === 'standard') problems.push({ level: 'warn', text: `${unknown.length} older print${unknown.length > 1 ? 's need' : ' needs'} a reprint check (${unknown.slice(0, 3).map(r => r.card.name).join(', ')}${unknown.length > 3 ? '…' : ''}). Old prints are legal only if the same card exists with a current mark; this resolves itself when you are online.` });
  if (missingData) problems.push({ level: 'warn', text: `${missingData} card${missingData > 1 ? 's' : ''} in this deck have no cached data yet. Open them online to load details.` });
  // ownership
  const byNameOwned = ownedByName();
  const remaining = new Map(byNameOwned);
  let value = 0, missingCost = 0, missingCount = 0, unit = null, unpriced = 0;
  const exactUsed = new Map();
  rows.forEach(r => {
    let owned;
    if (S.settings.deckMatch === 'exact') { const have = ownedQty(r.cardId) - (exactUsed.get(r.cardId) || 0); owned = clamp(have, 0, r.qty); exactUsed.set(r.cardId, (exactUsed.get(r.cardId) || 0) + owned); }
    else { const k = norm(r.card.name); const have = remaining.get(k) || 0; owned = clamp(have, 0, r.qty); remaining.set(k, have - owned); }
    r.owned = owned; r.short = r.qty - owned;
    const p = priceFor(r.card, 'normal');
    if (p) { value += p.value * r.qty; missingCost += p.value * r.short; unit ||= p.unit; } else if (r.short) unpriced++;
    missingCount += r.short;
  });
  const valid = !problems.some(p => p.level === 'bad');
  return { rows, total, byCat, problems, valid, value, missingCost, missingCount, unit: unit || (S.settings.priceSource === 'cardmarket' ? 'EUR' : 'USD'), unpriced };
}

   PTCGL text export / import
   ===================================================================== */
async function deckToText(deck) {
  const a = analyzeDeck(deck);
  // make sure set codes are known when online
  if (S.online) for (const r of a.rows) { const s = S.setsById.get(r.card.setId); if (s && !s.detail) { try { await getSetDetail(s.id); } catch { } } }
  const line = r => `${r.qty} ${r.card.name} ${setCode(r.card.setId)} ${r.card.localId}`;
  const grp = cat => a.rows.filter(r => r.card.category === cat);
  const parts = [];
  parts.push(`Pokémon: ${grp('Pokemon').reduce((n, r) => n + r.qty, 0)}`, ...grp('Pokemon').map(line), '');
  parts.push(`Trainer: ${grp('Trainer').reduce((n, r) => n + r.qty, 0)}`, ...grp('Trainer').map(line), '');
  parts.push(`Energy: ${grp('Energy').reduce((n, r) => n + r.qty, 0)}`, ...grp('Energy').map(line), '');
  parts.push(`Total Cards: ${a.total}`);
  return parts.join('\n');
}
function parseDeckText(text) {
  const out = [], bad = [];
  for (const raw of String(text || '').split(/\r?\n/)) {
    const l = raw.trim(); if (!l) continue;
    if (/^(pok[eé]mon|trainer|energy|total cards)\s*:/i.test(l) || /^#|^\/\//.test(l)) continue;
    // "4 Charmander MEW 4"   "12 Basic {R} Energy SVE 2"   "1 Iono PAL 185"  "2 Radiant Greninja ASR 46"
    let m = l.match(/^(\d+)\s*[x×]?\s+(.+?)\s+([A-Za-z][A-Za-z0-9-]{1,6})\s+([A-Za-z]{0,4}\d+[A-Za-z]{0,3})\s*$/);
    if (m) { out.push({ qty: Number(m[1]), name: m[2].trim(), code: m[3].toUpperCase(), localId: m[4].replace(/^0+(?=\d)/, '') }); continue; }
    m = l.match(/^(\d+)\s*[x×]?\s+(.+)$/);
    if (m) { out.push({ qty: Number(m[1]), name: m[2].trim(), code: null, localId: null }); continue; }
    bad.push(l);
  }
  return { lines: out, bad };
}
async function importDeckText(deck, text, onProgress) {
  const { lines, bad } = parseDeckText(text);
  const unresolved = [...bad];
  let done = 0;
  for (const ln of lines) {
    onProgress?.(++done, lines.length, ln);
    try {
      let card = null;
      if (ln.code && ln.localId) {
        let set = findSetByCode(ln.code) || await resolveSetCode(ln.code);
        if (set) { try { card = await getCard(set.id, ln.localId); } catch { try { card = await getCard(set.id, ln.localId.padStart(3, '0')); } catch { } } }
      }
      if (!card) {
        // fall back to name search: exact name, newest print, prefer Standard legal
        const found = S.online ? await searchCardsByName(ln.name) : localSearch(ln.name);
        const exact = found.filter(f => norm(f.name) === norm(ln.name));
        if (exact.length) {
          for (const f of exact.slice(0, 6)) { try { const c = await getCardById(f.id); if (deck.format !== 'standard' || standardLegality(c).state === 'legal') { card = c; break; } if (!card) card = c; } catch { } }
        }
      }
      if (!card) { unresolved.push(`${ln.qty} ${ln.name}${ln.code ? ' ' + ln.code + ' ' + ln.localId : ''}`); continue; }
      const cur = deck.cards.find(c => c.cardId === card.id);
      if (cur) cur.qty += ln.qty; else deck.cards.push({ cardId: card.id, qty: ln.qty });
      cacheImage(card);
    } catch (e) { unresolved.push(`${ln.qty} ${ln.name} (${e.message})`); }
  }
  await saveDeck(deck);
  return { added: lines.length - (unresolved.length - bad.length), unresolved };
}

async function scanCandidates({ num, total, codes, nameGuess }) {

    sets = [...byCode, ...sets.filter(s => !byCode.includes(s))];
    if (!sets.length && !total && codes.length && S.online) { for (const c of codes) { const s = await resolveSetCode(c, { limit: 25 }); if (s) sets.push(s); } }

async function refreshPrices(cardIds, { force = false, label = 'prices' } = {}) {

  if (!ids.length) { toast('Prices are already fresh'); return; }
  let done = 0, failed = 0;
  toast(`Refreshing ${label} 0/${ids.length}…`, 60000);
  const workers = Array.from({ length: 3 }, async () => { while (ids.length) { const id = ids.shift(); try { await refreshCard(id); } catch { failed++; } done++; if (done % 3 === 0) toast(`Refreshing ${label} ${done}/${done + ids.length}…`, 60000); } });
